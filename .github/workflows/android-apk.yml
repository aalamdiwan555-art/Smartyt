name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'HTTPS URL of the deployed Smartyt app'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve App URL
        id: app_url
        run: |
          URL="${{ inputs.app_url }}"
          if [ -z "$URL" ]; then
            URL="${{ vars.SMARTYT_APP_URL }}"
          fi
          if [[ -z "$URL" || "$URL" != https://* ]]; then
            echo "❌ Provide HTTPS URL via workflow input or SMARTYT_APP_URL variable"
            exit 1
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Building for $URL"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: ${{ steps.app_url.outputs.url }}

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.ts <<EOF
          import { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.smartyt.app',
            appName: 'Smartyt',
            webDir: 'out',
            server: {
              url: '${{ steps.app_url.outputs.url }}',
              cleartext: false,
              androidScheme: 'https'
            }
          };
          export default config;
          EOF
          cat capacitor.config.ts

      - name: Generate Android project (idempotent)
        run: |
          if [ ! -d "android" ]; then
            pnpm exec cap add android
          else
            echo "android folder exists, skipping add"
          fi
          pnpm exec cap sync android
          pnpm exec cap copy android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartyt-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach APK to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
